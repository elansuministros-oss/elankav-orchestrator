name: Orchestrator Channel Gateway Prod CI

on:
  push:
    branches:
      - release/ELANKAV-MULTICHANNEL-ORCH-PROD-01
      - release/CHANNEL-BRIDGE-AUTH-PROD-01
      - release/CHANNEL-BRIDGE-AUDIT-PROD-01
      - release/CHANNEL-AUDIT-MODE-FIX-PROD-01
      - release/CHANNEL-BRIDGE-DUAL-AUTH-PROD-01
      - release/RESEND-EMAIL-PROD-01
      - release/OWNER-EMAIL-SELFTEST-PROD-01
      - release/META-AUTH-AUDIT-PROD-01
      - release/META-AUTH-DIAGNOSTICS-PROD-01
      - release/META-INBOUND-RECEIVE-ONLY-PROD-01
      - fix/AI-SALES-AUTONOMY-CONTEXT-INTEGRATED-01
    paths:
      - 'api/channelDeliveryApi.js'
      - 'api/metaWebhookApi.js'
      - 'services/channelDeliveryService.js'
      - 'adapters/gmailDeliveryAdapter.js'
      - 'adapters/resendDeliveryAdapter.js'
      - 'adapters/metaDeliveryAdapter.js'
      - 'server.js'
      - 'services/ownerCommandService.js'
      - 'services/ownerOpsCapabilityRegistry.js'
      - 'services/ownerOpsReadService.js'
      - 'services/ownerEmailSelfTestService.js'
      - 'services/operatorModeService.js'
      - 'tests/ownerOpsReadService.test.js'
      - 'tests/commercialDeliveryAdapters.test.js'
      - 'tests/metaWebhookApi.test.js'
      - '.github/workflows/orchestrator-channel-gateway-prod-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-orchestrator-npm-cache
      NPM_CONFIG_PACKAGE_LOCK_ONLY: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax
        run: |
          node --check api/channelDeliveryApi.js
          node --check api/metaWebhookApi.js
          node --check services/channelDeliveryService.js
          node --check adapters/gmailDeliveryAdapter.js
          node --check adapters/resendDeliveryAdapter.js
          node --check adapters/metaDeliveryAdapter.js
          node --check services/ownerEmailSelfTestService.js
          node --check server.js

      - name: Channel gateway tests
        run: node --test tests/commercialDeliveryAdapters.test.js tests/wahaDeliveryAdapter.test.js tests/metaWebhookApi.test.js

      - name: Owner OPS supervisor regression
        run: node --test test/ownerOpsSupervisor.test.js tests/ownerWhatsAppRepositoryDeploy.test.js

      - name: Owner channel bridge audit
        run: node --test --test-name-pattern='channel bridge audit|channels.audit|email self-test|email tests|channels.email-test|Meta auth audit|channels.meta-audit' tests/ownerOpsReadService.test.js

      - name: ELANVISUAL WAHA regressions
        run: node --test test/wahaWebhookApi.test.js tests/vqsQuotationWaha01.test.js tests/ownerWahaSend01.test.js
