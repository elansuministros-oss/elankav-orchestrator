name: ELAN Unified Runtime CI

on:
  pull_request:
    branches:
      - fix/AI-SALES-AUTONOMY-CONTEXT-INTEGRATED-01
    paths:
      - 'services/elanUnified*.js'
      - 'services/ownerBusinessConnectClient.js'
      - 'services/ownerEntityCreateContinuityService.js'
      - 'services/ownerSeller*.js'
      - 'services/ownerHumanLanguage*.js'
      - 'services/humanLanguage*.js'
      - 'server.voice-pipeline-v2.js'
      - 'test/ownerSeller*.test.js'
      - 'test/humanLanguageInterpreter.test.js'
      - 'tests/ownerEntityCreateContinuity.test.js'
      - 'tests/ownerProviderStructuredContinuity.test.js'
      - '.github/workflows/elan-unified-runtime-ci.yml'
  push:
    branches:
      - feature/ELAN-OWNER-COMPLETE-TOOLS-01
    paths:
      - 'services/elanUnified*.js'
      - 'services/ownerBusinessConnectClient.js'
      - 'services/ownerEntityCreateContinuityService.js'
      - 'services/ownerSeller*.js'
      - 'services/ownerHumanLanguage*.js'
      - 'services/humanLanguage*.js'
      - 'server.voice-pipeline-v2.js'
      - 'test/ownerSeller*.test.js'
      - 'test/humanLanguageInterpreter.test.js'
      - 'tests/ownerEntityCreateContinuity.test.js'
      - 'tests/ownerProviderStructuredContinuity.test.js'
      - '.github/workflows/elan-unified-runtime-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check services/ownerBusinessConnectClient.js
          node --check services/ownerEntityCreateContinuityService.js
          node --check services/elanUnifiedToolRegistry.js
          node --check services/elanUnifiedRuntimeService.js
          node --check services/elanUnifiedRuntimeMessagePatch.js
          node --check services/elanUnifiedOwnerCommandService.js
          node --check services/ownerSellerTemporaryCredentialPatch.js
          node --check services/ownerSellerPreviewConfirmationPatch.js
          node --check services/ownerSellerRecruitmentService.js
          node --check services/ownerSellerRecruitmentMessagePatch.js
          node --check services/ownerSellerUpdateOutreachService.js
          node --check services/ownerSellerUpdateOutreachMessagePatch.js
          node --check services/humanLanguageInterpreter.js
          node --check services/ownerHumanLanguageIntentPatch.js
          node --check services/humanLanguageMessagePatch.js
          node --check server.voice-pipeline-v2.js
          node --check tests/ownerEntityCreateContinuity.test.js
          node --check tests/ownerProviderStructuredContinuity.test.js
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Existing Owner business regression tests
        run: |
          node --test \
            tests/ownerBusinessQuotationItemPatch.test.js \
            tests/ownerBusinessProcessMessageGateway.test.js \
            tests/ownerBusinessProcessMessageIntegration.test.js \
            tests/ownerQuotationHomonymResolver.test.js
      - name: Owner entity continuity regression tests
        run: |
          node --test \
            tests/ownerEntityCreateContinuity.test.js \
            tests/ownerProviderStructuredContinuity.test.js
      - name: Seller and human-language regression tests
        run: |
          node --test \
            test/elanUnifiedOwnerCommandService.seller-natural-fields.test.js \
            test/ownerSellerTemporaryCredentialPatch.test.js \
            test/ownerSellerPreviewConfirmationPatch.test.js \
            test/ownerSellerRecruitmentService.test.js \
            test/ownerSellerUpdateOutreachService.test.js \
            test/humanLanguageInterpreter.test.js

  owner_entity_continuity:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax continuity
        run: |
          node --check services/ownerEntityCreateContinuityService.js
          node --check tests/ownerEntityCreateContinuity.test.js
          node --check tests/ownerProviderStructuredContinuity.test.js
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Owner entity continuity tests
        run: |
          node --test \
            tests/ownerEntityCreateContinuity.test.js \
            tests/ownerProviderStructuredContinuity.test.js

  owner_provider_edit:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax provider edit
        run: |
          node --check services/elanUnifiedOwnerCommandService.js
          node --check test/elanUnifiedOwnerCommandService.seller-natural-fields.test.js
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Provider edit parser regression tests
        run: node --test test/elanUnifiedOwnerCommandService.seller-natural-fields.test.js
