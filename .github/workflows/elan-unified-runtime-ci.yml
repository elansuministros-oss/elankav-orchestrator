name: ELAN Unified Runtime CI

on:
  pull_request:
    branches:
      - fix/AI-SALES-AUTONOMY-CONTEXT-INTEGRATED-01
    paths:
      - 'services/elanUnified*.js'
      - 'services/ownerBusinessConnectClient.js'
      - 'services/ownerSeller*.js'
      - 'server.voice-pipeline-v2.js'
      - 'test/ownerSeller*.test.js'
      - '.github/workflows/elan-unified-runtime-ci.yml'
  push:
    branches:
      - feature/ELAN-OWNER-COMPLETE-TOOLS-01
    paths:
      - 'services/elanUnified*.js'
      - 'services/ownerBusinessConnectClient.js'
      - 'services/ownerSeller*.js'
      - 'server.voice-pipeline-v2.js'
      - 'test/ownerSeller*.test.js'
      - '.github/workflows/elan-unified-runtime-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check services/ownerBusinessConnectClient.js
          node --check services/elanUnifiedToolRegistry.js
          node --check services/elanUnifiedRuntimeService.js
          node --check services/elanUnifiedRuntimeMessagePatch.js
          node --check services/elanUnifiedOwnerCommandService.js
          node --check services/ownerSellerTemporaryCredentialPatch.js
          node --check services/ownerSellerPreviewConfirmationPatch.js
          node --check server.voice-pipeline-v2.js
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Existing Owner business regression tests
        run: |
          node --test \
            tests/ownerBusinessQuotationItemPatch.test.js \
            tests/ownerBusinessProcessMessageGateway.test.js \
            tests/ownerBusinessProcessMessageIntegration.test.js \
            tests/ownerQuotationHomonymResolver.test.js
      - name: Seller preview confirmation regression tests
        run: |
          node --test \
            test/elanUnifiedOwnerCommandService.seller-natural-fields.test.js \
            test/ownerSellerTemporaryCredentialPatch.test.js \
            test/ownerSellerPreviewConfirmationPatch.test.js
