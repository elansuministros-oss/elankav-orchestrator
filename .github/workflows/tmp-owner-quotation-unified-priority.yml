name: TEMP Owner Quotation Unified Priority

on:
  push:
    branches:
      - fix/OWNER-QUOTATION-UNIFIED-PRIORITY-01

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: Syntax
        run: |
          node --check services/elanUnifiedOwnerCommandService.js
          node --check services/elanUnifiedRuntimeMessagePatch.js
          node --check services/ownerBusinessCommandService.js
          node --check tests/ownerQuotationUnifiedPriority.test.js
          node --check tests/ownerQuotationLookupSend.test.js

      - name: Quotation priority regressions
        run: |
          node --test             tests/ownerQuotationUnifiedPriority.test.js             tests/ownerQuotationLookupSend.test.js             tests/ownerCustomerList.test.js             tests/ownerBusinessModesPricingLogistics.test.js

      - name: Existing unified runtime regressions
        run: |
          node --test             tests/ownerEntityCreateContinuity.test.js             tests/ownerProviderStructuredContinuity.test.js             test/elanUnifiedOwnerCommandService.seller-natural-fields.test.js             tests/elanGoOwnerControlRegression.test.js             tests/elanGoBrokerControlRegression.test.js             tests/elanGoDiscoveryRegression.test.js

      - name: Preserve provider recruitment
        run: node --test test/ownerProviderRecruitmentMessagePatch.test.js
