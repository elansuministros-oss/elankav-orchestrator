name: ELAN Self-Audit Validation

on:
  push:
    branches:
      - feature/ELAN-SELF-AUDIT-VALIDATION-01
  pull_request:
    branches:
      - fix/UNIFIED-ACTOR-CONTEXT-FASE-1-3-01

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax
        run: |
          node --check server.js
          node --check services/elanSelfAuditService.js
          node --check services/elanSelfAuditMonitorService.js
          node --check services/ownerCommandService.js
          node --check services/messageService.js
          node --check services/ownerOpsCapabilityRegistry.js
      - name: Self-Audit Tests
        run: |
          node --test tests/elanSelfAuditService.test.js tests/elanSelfAuditMonitorService.test.js tests/elanSelfAuditOwnerCommand.test.js
      - name: Existing Owner Regression Suite
        run: |
          node --test test/ownerOpsCommandRouting.test.js test/ownerOpsReadService.test.js test/ownerOpsConfirmation.test.js test/ownerOpsAudit.test.js test/ownerOpsSupervisor.test.js test/ownerOpsSupervisorCommandPatch.test.js test/codePrepareJob.test.js test/ownerSellerRegistration.test.js tests/ownerBusinessModesPricingLogistics.test.js tests/ownerConnectRuntimeAuditService.test.js tests/ownerPriceCatalogAdminService.test.js tests/connectActorIdentityFailClosed.test.js
