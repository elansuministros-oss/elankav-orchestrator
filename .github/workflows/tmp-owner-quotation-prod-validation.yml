name: TEMP Owner Quotation Production Validation

on:
  push:
    branches:
      - fix/OWNER-QUOTATION-LOOKUP-PROD-02

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: Syntax
        run: |
          node --check services/ownerBusinessCommandService.js
          node --check tests/ownerQuotationLookupSend.test.js
          node --check services/ownerProviderRecruitmentMessagePatch.js
          node --check test/ownerProviderRecruitmentMessagePatch.test.js

      - name: Quotation and neighboring Owner regressions
        run: |
          node --test             tests/ownerQuotationLookupSend.test.js             tests/ownerCustomerList.test.js             tests/ownerBusinessModesPricingLogistics.test.js             tests/ownerBusinessQuotationItemPatch.test.js             tests/ownerBusinessProcessMessageIntegration.test.js             tests/ownerQuotationHomonymResolver.test.js

      - name: Preserve latest provider recruitment behavior
        run: node --test test/ownerProviderRecruitmentMessagePatch.test.js

      - name: Confirm unrelated gateway failure matches current production base
        shell: bash
        run: |
          set +e
          node --test tests/ownerBusinessProcessMessageGateway.test.js > /tmp/current-gateway.log 2>&1
          CURRENT_RC=$?
          set -e
          cat /tmp/current-gateway.log
          test "$CURRENT_RC" -ne 0
          grep -q "IDENTITY_AUTHORITY_UNAVAILABLE" /tmp/current-gateway.log
          grep -q "# fail 1" /tmp/current-gateway.log

          git checkout --detach b8fbe0cc3bf984fe065d95d1ef7c38f049c90662
          npm install --ignore-scripts

          set +e
          node --test tests/ownerBusinessProcessMessageGateway.test.js > /tmp/base-gateway.log 2>&1
          BASE_RC=$?
          set -e
          cat /tmp/base-gateway.log
          test "$BASE_RC" -ne 0
          grep -q "IDENTITY_AUTHORITY_UNAVAILABLE" /tmp/base-gateway.log
          grep -q "# fail 1" /tmp/base-gateway.log
