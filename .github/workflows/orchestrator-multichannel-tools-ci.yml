name: Orchestrator Multichannel Tools CI

on:
  push:
    branches:
      - orchestrator-next
      - feature/ELAN-OPENAI-MULTICHANNEL-TOOLS-01
    paths:
      - 'adapters/connectMarketplaceToolAdapter.js'
      - 'adapters/connectChannelToolAdapter.js'
      - 'adapters/openaiAdapter.js'
      - 'adapters/gmailDeliveryAdapter.js'
      - 'adapters/metaDeliveryAdapter.js'
      - 'services/channelDeliveryService.js'
      - 'api/channelDeliveryApi.js'
      - 'server.js'
      - 'services/ownerOpsDeployBridge.js'
      - 'test/ownerOpsDeployBridge.test.js'
      - 'services/openaiCommercialToolService.js'
      - 'services/openaiChannelToolService.js'
      - 'tests/openaiCommercialTools.test.js'
      - 'tests/commercialDeliveryAdapters.test.js'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/deploy-markers/**'
      - '.github/workflows/orchestrator-multichannel-tools-ci.yml'
  pull_request:
    paths:
      - 'adapters/connectMarketplaceToolAdapter.js'
      - 'adapters/connectChannelToolAdapter.js'
      - 'adapters/openaiAdapter.js'
      - 'adapters/gmailDeliveryAdapter.js'
      - 'adapters/metaDeliveryAdapter.js'
      - 'services/channelDeliveryService.js'
      - 'api/channelDeliveryApi.js'
      - 'server.js'
      - 'services/ownerOpsDeployBridge.js'
      - 'test/ownerOpsDeployBridge.test.js'
      - 'services/openaiCommercialToolService.js'
      - 'services/openaiChannelToolService.js'
      - 'tests/openaiCommercialTools.test.js'
      - 'tests/commercialDeliveryAdapters.test.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/orchestrator-multichannel-tools-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Syntax
        run: |
          node --check adapters/connectMarketplaceToolAdapter.js
          node --check adapters/connectChannelToolAdapter.js
          node --check adapters/openaiAdapter.js
          node --check adapters/gmailDeliveryAdapter.js
          node --check adapters/metaDeliveryAdapter.js
          node --check services/channelDeliveryService.js
          node --check api/channelDeliveryApi.js
          node --check server.js
          node --check services/ownerOpsDeployBridge.js
          node --check test/ownerOpsDeployBridge.test.js
          node --check services/openaiChannelToolService.js
          node --check tests/openaiCommercialTools.test.js

      - name: Multichannel tool tests
        run: node --test tests/openaiCommercialTools.test.js tests/commercialDeliveryAdapters.test.js test/ownerOpsDeployBridge.test.js
