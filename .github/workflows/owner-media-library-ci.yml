name: Owner Multimedia Library CI

on:
  pull_request:
    paths:
      - 'api/wahaWebhookApi.js'
      - 'services/prospectingMediaLibraryService.js'
      - 'test/wahaWebhookApi.test.js'
      - 'test/prospectingMediaLibraryService.test.js'
      - '.github/workflows/owner-media-library-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Syntax
        run: |
          node --check api/wahaWebhookApi.js
          node --check services/prospectingMediaLibraryService.js
          node --check test/wahaWebhookApi.test.js
          node --check test/prospectingMediaLibraryService.test.js

      - name: Multimedia classification regressions
        run: node --test test/prospectingMediaLibraryService.test.js

      - name: WAHA multimedia ingress regressions
        run: node --test --test-name-pattern="extractIncoming preserves classified image/video captions|Owner guarda una foto de WhatsApp en Biblioteca multimedia" test/wahaWebhookApi.test.js
