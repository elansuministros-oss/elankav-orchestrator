name: Verified Actor Context QA

on:
  push:
    branches:
      - fix/SELLER-VERIFIED-IDENTITY-PERSONALIZATION-01
    paths:
      - 'services/openaiService.js'
      - 'tests/verifiedActorContext.test.js'
      - '.github/workflows/verified-actor-context-qa.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax
        run: node --check services/openaiService.js
      - name: Verified actor context
        run: node --test tests/verifiedActorContext.test.js
      - name: Seller runtime regression
        run: node --test tests/sellerUnifiedRuntimeRegression.test.js
      - name: Identity fail-closed regression
        run: node --test tests/connectActorIdentityFailClosed.test.js
      - name: Message context regression
        run: node --test tests/clientContext01History.test.js tests/messageServiceDesignRouting.test.js
