name: TEMP Unified Semantic Memory Validation

on:
  push:
    branches:
      - feature/OWNER-SEMANTIC-CONTEXT-01

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts
      - name: Syntax
        run: |
          node --check services/ownerSemanticIntentService.js
          node --check services/ownerBusinessCommandService.js
          node --check services/ownerBusinessContextService.js
          node --check services/ownerQuotationService.js
          node --check services/connectConversationClient.js
          node --check services/elanUnifiedRuntimeService.js
          node --check services/elanUnifiedRuntimeMessagePatch.js
          node --check services/messageService.js
          node --check services/openaiService.js
      - name: New semantic and universal memory regressions
        run: |
          node --test             tests/ownerSemanticConversationMemory.test.js             tests/universalConversationMemory.test.js             tests/ownerQuotationCustomerList.test.js
      - name: Existing quotation regressions
        run: |
          node --test             tests/ownerQuotationLookupSend.test.js             tests/ownerQuotationSplit.test.js             tests/ownerQuotationSplitSend.test.js             tests/ownerQuotationUnifiedPriority.test.js             tests/ownerBusinessQuotationItemPatch.test.js             tests/ownerQuotationHomonymResolver.test.js
      - name: Preserve customer provider and business routing
        run: |
          node --test             tests/ownerCustomerList.test.js             tests/ownerBusinessModesPricingLogistics.test.js             tests/ownerProviderStructuredContinuity.test.js             tests/ownerEntityCreateContinuity.test.js             test/ownerProviderRecruitmentMessagePatch.test.js
      - name: ELAN GO regressions
        run: |
          node --test             tests/elanGoOwnerControlRegression.test.js             tests/elanGoBrokerControlRegression.test.js             tests/elanGoDiscoveryRegression.test.js
