name: Owner Business Native Router CI

on:
  push:
    branches:
      - fix/OWNER-BUSINESS-NATIVE-ROUTER-01
      - fix/OWNER-BUSINESS-HOMONYM-RESOLUTION-01
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: /tmp/elankav-npm-cache
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --ignore-scripts

      - name: Syntax
        run: |
          node --check services/ownerBusinessProcessMessageGateway.js
          node --check services/ownerBusinessQuotationItemPatch.js
          node --check services/ownerQuotationHomonymResolver.js
          node --check tests/ownerBusinessProcessMessageGateway.test.js
          node --check tests/ownerBusinessProcessMessageIntegration.test.js
          node --check tests/ownerQuotationHomonymResolver.test.js

      - name: Owner business routing tests
        run: |
          node --test \
            tests/ownerBusinessQuotationItemPatch.test.js \
            tests/ownerBusinessProcessMessageGateway.test.js \
            tests/ownerBusinessProcessMessageIntegration.test.js \
            tests/ownerQuotationHomonymResolver.test.js
