name: CI

on:
  pull_request:
  push:
    branches:
      - agent/voice-pipeline-v2

jobs:
  ai-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate changed modules
        run: |
          node --check services/aiRuntimeClient.js
          node --check services/aiConversationContinuityService.js
          node --check services/messageService.js
      - name: Run new runtime tests
        run: node --test tests/aiRuntimeClient.test.js tests/aiConversationContinuityService.test.js

  legacy-regression-observation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Observe complete inherited suite
        run: npm test
