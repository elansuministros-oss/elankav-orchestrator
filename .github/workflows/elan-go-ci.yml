name: ELAN GO CI

on:
  push:
    branches:
      - feature/ELAN-GO-WHATSAPP-CONTROL-01
      - feature/ELAN-GO-AUTONOMOUS-WEB-RADAR-01
      - hotfix/ELAN-GO-INTEREST-BROKER-01
  pull_request:
    branches:
      - fix/AI-SALES-AUTONOMY-CONTEXT-INTEGRATED-01

jobs:
  elan-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_CACHE: /tmp/elan-go-npm-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies without deployment hooks
        run: npm ci --ignore-scripts

      - name: Syntax
        run: |
          node --check server.js
          node --check services/ownerBusinessConnectClient.js
          node --check services/ownerElanGoControlService.js
          node --check services/ownerCommandService.js
          node --check services/elanUnifiedOwnerCommandService.js
          node --check services/elanUnifiedRuntimeMessagePatch.js
          node --check services/elanMarketplaceWebSearchService.js
          node --check services/elanMarketplaceDiscoveryService.js
          node --check services/elanMarketplaceSourceVerificationService.js
          node --check services/elanMarketplaceAutonomyService.js
          node --check services/elanMarketplaceBrokerWorkerService.js
          node --check services/elanMarketplaceInterestOutreachService.js
          node --check services/elanMarketplaceBuyerHunterService.js
          node --check services/elanUnifiedToolRegistry.js

      - name: ELAN GO regressions
        run: |
          node --test \
            tests/elanGoOwnerControlRegression.test.js \
            tests/elanGoBrokerControlRegression.test.js \
            tests/elanGoDiscoveryRegression.test.js
